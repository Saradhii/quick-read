<!DOCTYPE html>
<html>
<head>
  <title>Quick Read Extension</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      width: 320px;
      height: 450px;
      padding: 0;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      background: #ffffff;
      height: 100%;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 20px 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      background: #ffffff;
    }

    h3 {
      color: #0f172a;
      text-align: center;
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    select#summaryLength {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      background: #ffffff;
      color: #374151;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 8px center;
      background-repeat: no-repeat;
      background-size: 16px;
      padding-right: 32px;
    }

    select#summaryLength:hover {
      border-color: #9ca3af;
    }

    select#summaryLength:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button#summarizeButton {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    button#summarizeButton:hover {
      background: #2563eb;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }

    button#summarizeButton:active {
      background: #1d4ed8;
    }

    button#summarizeButton:disabled {
      background: #e5e7eb;
      cursor: not-allowed;
      color: #9ca3af;
      box-shadow: none;
    }

    #loader {
      display: none;
      padding: 16px;
      text-align: center;
      color: #6b7280;
      background: #f9fafb;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }

    .loader-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #e5e7eb;
      border-top: 2px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .dots {
      display: flex;
      gap: 3px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background: #3b82f6;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    #summary {
      flex: 1;
      border: 1px solid #e5e7eb;
      padding: 16px;
      background: #ffffff;
      border-radius: 6px;
      overflow-y: auto;
      overflow-x: hidden;
      word-wrap: break-word;
      hyphens: auto;
    }

    #summary p {
      margin: 0 0 12px 0;
      line-height: 1.6;
      color: #374151;
      font-size: 14px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #summary p:last-child {
      margin-bottom: 0;
    }

    #summary ul {
      padding-left: 18px;
      margin: 0 0 12px 0;
    }

    #summary li {
      margin-bottom: 8px;
      line-height: 1.6;
      color: #374151;
      font-size: 14px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #summary li:last-child {
      margin-bottom: 0;
    }

    /* Custom scrollbar */
    #summary::-webkit-scrollbar {
      width: 6px;
    }

    #summary::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 3px;
    }

    #summary::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    #summary::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Placeholder text styling */
    .placeholder {
      color: #6b7280;
      font-style: italic;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>Quick Read</h3>
    </div>

    <div class="content">
      <div id="controls">
        <select id="summaryLength">
          <option value="short" selected>Concise Summary</option>
          <option value="medium">Detailed Summary</option>
        </select>
        <button id="summarizeButton">Generate Summary</button>
      </div>

      <div id="loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <span>Analyzing content</span>
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>

      <div id="summary">
        <div class="placeholder">
          Select summary length and click the button to summarize the current page content.
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
