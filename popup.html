<!DOCTYPE html>
<html>
<head>
  <title>Quick Read Extension</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      width: 350px;
      height: 480px;
      padding: 0;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
      font-size: 14px;
      line-height: 1.5;
    }

    .content-wrapper {
      background: #ffffff;
      height: 100%;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h3 {
      color: #0f172a;
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.025em;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    select#summaryLength {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      background: #ffffff;
      color: #374151;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 8px center;
      background-repeat: no-repeat;
      background-size: 16px;
      padding-right: 32px;
    }

    select#summaryLength:hover {
      border-color: #9ca3af;
    }

    select#summaryLength:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button#summarizeButton {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      white-space: nowrap;
    }

    button#summarizeButton:hover {
      background: #2563eb;
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
    }

    button#summarizeButton:active {
      background: #1d4ed8;
    }

    button#summarizeButton:disabled {
      background: #e5e7eb;
      cursor: not-allowed;
      color: #9ca3af;
      box-shadow: none;
    }

    #loader {
      display: none;
      padding: 15px;
      text-align: center;
      color: #6b7280;
      background: #f9fafb;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      margin-bottom: 20px;
      font-style: italic;
    }

    #summary {
      flex: 1;
      border: 1px solid #e5e7eb;
      padding: 12px;
      background: #ffffff;
      border-radius: 6px;
      overflow-y: auto;
      overflow-x: hidden;
      word-wrap: break-word;
      hyphens: auto;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    /* Markdown Content Styling */
    #summary h1, #summary h2, #summary h3, #summary h4, #summary h5, #summary h6 {
      margin-top: 12px;
      margin-bottom: 6px;
      color: #1e293b;
      font-weight: 600;
      line-height: 1.4;
    }

    #summary h1 { 
      font-size: 1.4em; 
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
    }
    #summary h2 { 
      font-size: 1.3em; 
    }
    #summary h3 { 
      font-size: 1.2em; 
    }

    #summary p {
      margin: 0 0 10px 0;
      line-height: 1.6;
      color: #374151;
      font-size: 14px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #summary p:last-child {
      margin-bottom: 0;
    }

    #summary ul, #summary ol {
      padding-left: 20px;
      margin: 0 0 12px 0;
    }

    #summary li {
      margin-bottom: 6px;
      line-height: 1.6;
      color: #374151;
      font-size: 14px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #summary li:last-child {
      margin-bottom: 0;
    }

    #summary strong {
      font-weight: 600;
      color: #1e293b;
    }

    #summary em {
      font-style: italic;
      color: #4b5563;
    }

    #summary code {
      background-color: #f1f5f9;
      color: #e11d48;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      font-size: 13px;
      border: 1px solid #e2e8f0;
    }

    #summary blockquote {
      border-left: 3px solid #3b82f6;
      padding-left: 12px;
      margin: 12px 0;
      color: #6b7280;
      font-style: italic;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 0 4px 4px 0;
    }

    /* Custom scrollbar */
    #summary::-webkit-scrollbar {
      width: 6px;
    }

    #summary::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 3px;
    }

    #summary::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    #summary::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Placeholder text styling */
    .placeholder {
      color: #6b7280;
      font-style: italic;
      text-align: center;
      padding: 20px 0;
    }

    /* Responsive adjustments */
    @media (max-width: 360px) {
      #controls {
        flex-direction: column;
        gap: 8px;
      }
      
      select#summaryLength {
        width: 100%;
      }
      
      button#summarizeButton {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <h3>Quick Read</h3>
    <div id="controls">
      <select id="summaryLength">
        <option value="short" selected>Concise Summary</option>
        <option value="medium">Detailed Summary</option>
      </select>
      <button id="summarizeButton">Summarize Page</button>
    </div>
    <div id="loader">Summarizing with AI...</div>
    <div id="summary">
      <div class="placeholder">
        Select summary length and click the button to summarize the current page content.
      </div>
    </div>
  </div>

  <!-- Include markdown-it library -->
  <script src="lib/markdown-it.min.js"></script>
  <!-- Existing popup.js script -->
  <script src="popup.js"></script>
</body>
</html>
